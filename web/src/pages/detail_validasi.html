<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Validasi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  padding:16px;
}

/* container */
.container{
  max-width:520px;
  margin:auto;
}

/* HEADER */
.header{
  margin-bottom:12px;
}

.header h3{
  font-size:18px;
  font-weight:600;
  color:#0f172a;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.92);
  padding:16px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* DETAIL */
.title{
  font-weight:600;
  font-size:15px;
}

.sub{
  font-size:12px;
  color:#64748b;
  margin-top:2px;
}

.desc{
  font-size:13px;
  margin-top:6px;
  color:#334155;
}

/* KOMENTAR */
#komentar{
  margin-top:14px;
}

.comment{
  background:#f8fafc;
  padding:12px;
  border-radius:14px;
  margin-top:10px;
  border:1px solid #e2e8f0;
}

.comment-header{
  display:flex;
  justify-content:space-between;
}

.user{
  font-size:12px;
  font-weight:600;
  color:#1e293b;
}

.time{
  font-size:10px;
  color:#64748b;
}

.text{
  font-size:13px;
  margin-top:6px;
  color:#334155;
}

/* badge */
.badge{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  padding:4px 10px;
  border-radius:999px;
  color:white;
}

.benar{background:#22c55e;}
.salah{background:#ef4444;}

/* input */
textarea{
  width:100%;
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  resize:none;
}

select{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:14px;
  border:1px solid #e2e8f0;
}

/* button */
.send{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* back button */
.back{
  display:block;
  text-align:center;
  margin-top:14px;
  text-decoration:none;
  color:#2563eb;
  font-size:13px;
  font-weight:500;
}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER (INI SUDAH BALIK) -->
  <div class="header">
    <h3>Detail Validasi</h3>
  </div>

  <div class="card">

    <div id="detail"></div>

    <div id="komentar"></div>

    <textarea id="text" placeholder="Tulis pendapat kamu..."></textarea>

    <select id="status">
      <option value="">-- Pilih Validasi --</option>
      <option value="benar">Benar</option>
      <option value="salah">Salah</option>
    </select>

    <button onclick="kirim()" class="send">Kirim Validasi</button>

  </div>

  <!-- 🔙 TOMBOL KEMBALI (INI SUDAH ADA LAGI) -->
  <a href="validasi.html" class="back">Kembali</a>

</div>

<script>

/* DATA */
let data = [
  {
    id:1,
    area:"TA",
    slot:"A1",
    kondisi:"Kosong",
    desc:"Slot kosong sejak pagi",
    komentar:[
      {user:"Andi", text:"Valid kosong dari pagi", status:"benar", time:"14 April 2026 - 08:10:21"},
      {user:"Budi", text:"Saya cek langsung kosong", status:"benar", time:"14 April 2026 - 08:12:10"},
      {user:"Sinta", text:"Tidak ada kendaraan", status:"benar", time:"14 April 2026 - 08:15:44"}
    ]
  }
];

let id = localStorage.getItem("pilihValidasi");
let item = data.find(d => d.id == id);

/* DETAIL */
function renderDetail(){
  document.getElementById("detail").innerHTML = `
    <div class="title">Area ${item.area} - Slot ${item.slot}</div>
    <div class="sub">Status: ${item.kondisi}</div>
    <div class="desc">${item.desc}</div>
  `;
}

/* KOMENTAR */
function renderKomentar(){
  let box = document.getElementById("komentar");
  box.innerHTML = "";

  item.komentar.forEach(k=>{
    box.innerHTML += `
      <div class="comment">

        <div class="comment-header">
          <div class="user">${k.user}</div>
          <div class="time">${k.time}</div>
        </div>

        <div class="text">${k.text}</div>

        <span class="badge ${k.status}">
          ${k.status}
        </span>

      </div>
    `;
  });
}

/* TIME */
function getTimeNow(){
  const now = new Date();

  const date = now.toLocaleDateString('id-ID',{
    day:'2-digit',
    month:'long',
    year:'numeric'
  });

  const time = now.toLocaleTimeString('id-ID',{
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit'
  });

  return `${date} - ${time}`;
}

/* KIRIM */
function kirim(){
  let text = document.getElementById("text").value;
  let status = document.getElementById("status").value;

  if(!status){
    alert("Pilih status dulu!");
    return;
  }

  item.komentar.push({
    user:"User",
    text:text,
    status:status,
    time:getTimeNow()
  });

  renderKomentar();

  document.getElementById("text").value = "";
  document.getElementById("status").value = "";
}

/* INIT */
renderDetail();
renderKomentar();

</script>

</body>
</html>
