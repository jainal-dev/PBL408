<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/auth.css">
</head>

<body>

<div class="wrapper">

  <div class="header">
    <h1>Smart <span>Parking</span></h1>
    <p>Buat akun baru 🚗</p>
  </div>

  <div class="form-container">

    <div class="input-group">
      <label>Nama</label>
      <input type="text" placeholder="Masukkan nama">
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Masukkan email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Buat password">
    </div>

    <div class="input-group">
      <label>Konfirmasi Password</label>
      <input type="password" placeholder="Ulangi password">
    </div>

    <button onclick="register()">Daftar</button>

    <div class="footer">
      <a href="login.html">Sudah punya akun? Login</a>
    </div>

  </div>

</div>

<script>
function register() {
  document.querySelector(".wrapper").style.transform = "scale(0.95)";
  document.querySelector(".wrapper").style.opacity = "0.5";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 300);
}
</script>

</body>
</html>
