<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-login">
  <div class="admin-login-card">
    <h1>Admin Portal</h1>
    <p>Masuk dengan akun admin untuk mengelola laporan dan data parkir.</p>
    <div class="admin-form">
      <div class="input-group">
        <label>Email admin</label>
        <input type="email" id="adminEmail" placeholder="admin@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Masukkan password">
      </div>
      <button class="action-button" onclick="loginAdmin()">Masuk Admin</button>
    </div>
    <div class="admin-footer">
      <p>Gunakan akun dengan role admin saja.</p>
    </div>
  </div>
</div>
<script>
function loginAdmin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value.trim();

  if (!email || !password) {
    alert('Email dan password harus diisi.');
    return;
  }

  localStorage.setItem('authRole', 'admin');
  localStorage.setItem('authEmail', email);
  window.location.hash = 'admin/dashboard';
}
</script>
</body>
</html>
