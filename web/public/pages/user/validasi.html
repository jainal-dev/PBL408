<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validasi Laporan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/user.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  padding:16px;
}

/* HEADER */
h3{
  margin-bottom:14px;
  font-size:18px;
}

/* FILTER BAR */
.topbar{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:12px;
}

/* SEARCH FULL WIDTH */
.search-box{
  grid-column:1 / -1;
}

/* INPUT + SELECT STYLE */
select, input{
  width:100%;
  padding:11px 12px;
  border-radius:14px;
  border:1px solid #e2e8f0;
  outline:none;
  background:white;
  font-size:13px;
  transition:0.2s;
}

select:focus, input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

/* GRID */
#list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:12px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.92);
  padding:14px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.title{
  font-weight:600;
  font-size:14px;
}

.sub{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}

.desc{
  font-size:13px;
  margin-top:6px;
  color:#334155;
}

/* BADGE */
.badge{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  padding:4px 10px;
  border-radius:999px;
  color:white;
  font-weight:500;
}

/* FIX CLASS SAFE */
.Kosong{background:#22c55e;}
.Terisi{background:#f59e0b;}
.Rusak{background:#ef4444;}

/* BUTTON */
button{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  cursor:pointer;
  font-weight:500;
}

button:hover{
  opacity:0.9;
}
</style>
</head>

<body>

<h3>Validasi Laporan Parkir</h3>

<!-- FILTER BAR -->
<div class="topbar">

  <!-- DROPDOWN LOKASI -->
  <select id="filterArea" onchange="render()">
    <option value="all">Semua Lokasi</option>
    <option value="TA">TA</option>
    <option value="GU">GU</option>
    <option value="Techno">Techno</option>
    <option value="RTF">RTF</option>
  </select>

  <!-- DROPDOWN STATUS -->
  <select id="filterStatus" onchange="render()">
    <option value="all">Semua Status</option>
    <option value="Kosong">Kosong</option>
    <option value="Terisi">Terisi</option>
    <option value="Rusak">Rusak</option>
  </select>

  <!-- SEARCH FULL CENTER -->
  <div class="search-box">
    <input type="text" id="search" placeholder="Cari slot (A1, B2, C3...)" oninput="render()">
  </div>

</div>

<div id="list"></div>

<script>

/* DATA DUMMY */
let data = [
  {id:1, area:"TA", slot:"A1", kondisi:"Kosong", desc:"Slot kosong sejak pagi"},
  {id:2, area:"TA", slot:"A2", kondisi:"Terisi", desc:"Mobil merah parkir"},
  {id:3, area:"TA", slot:"A3", kondisi:"Rusak", desc:"Sensor error"},
  {id:4, area:"GU", slot:"B1", kondisi:"Kosong", desc:"Baru dibersihkan"},
  {id:5, area:"GU", slot:"B2", kondisi:"Terisi", desc:"Motor penuh"},
  {id:6, area:"GU", slot:"B3", kondisi:"Terisi", desc:"Mobil SUV"},
  {id:7, area:"Techno", slot:"C1", kondisi:"Rusak", desc:"Sensor mati total"},
  {id:8, area:"Techno", slot:"C2", kondisi:"Kosong", desc:"Area aman"},
  {id:9, area:"Techno", slot:"C3", kondisi:"Terisi", desc:"Padat siang"},
  {id:10, area:"RTF", slot:"D1", kondisi:"Terisi", desc:"Weekend full"},
  {id:11, area:"RTF", slot:"D2", kondisi:"Kosong", desc:"Lantai 2 kosong"},
  {id:12, area:"RTF", slot:"D3", kondisi:"Rusak", desc:"Barrier error"},
  {id:13, area:"TA", slot:"A4", kondisi:"Kosong", desc:"Baru tersedia"},
  {id:14, area:"GU", slot:"B4", kondisi:"Terisi", desc:"Motor padat"},
  {id:15, area:"RTF", slot:"D4", kondisi:"Kosong", desc:"Area baru dibuka"},
];

/* RENDER */
function render(){

  let area = document.getElementById("filterArea").value;
  let status = document.getElementById("filterStatus").value;
  let search = document.getElementById("search").value.toLowerCase();

  let list = document.getElementById("list");
  list.innerHTML = "";

  let filtered = data.filter(d=>{
    return (area==="all" || d.area===area) &&
           (status==="all" || d.kondisi===status) &&
           (d.slot.toLowerCase().includes(search));
  });

  filtered.forEach(d=>{
    list.innerHTML += `
      <div class="card">
        <div class="title">Area ${d.area} - Slot ${d.slot}</div>

        <div class="sub">Status parkir</div>

        <span class="badge ${d.kondisi}">
          ${d.kondisi}
        </span>

        <div class="desc">${d.desc}</div>

        <button onclick="buka(${d.id})">
          Validasi
        </button>
      </div>
    `;
  });

  if(filtered.length === 0){
    list.innerHTML = `<p style="color:#64748b">Data tidak ditemukan 😢</p>`;
  }
}

/* NAVIGASI */
function buka(id){
  localStorage.setItem("pilihValidasi", id);
  window.location.hash = 'user/detail_validasi';
}

/* INIT */
render();

</script>

</body>
</html>
