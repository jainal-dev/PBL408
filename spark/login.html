<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #dbeafe, #eff6ff);
  overflow: hidden;
}

/* 🌊 animated glow */
body::before, body::after {
  content: '';
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  animation: floatGlow 6s ease-in-out infinite;
}

body::before { background: #60a5fa; top: -80px; left: -80px; }
body::after { background: #3b82f6; bottom: -80px; right: -80px; animation-delay: 2s; }

@keyframes floatGlow {
  0%, 100% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(20px) scale(1.1); }
}

.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;

  /* ✨ ANIMASI MASUK */
  animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 18px;
  animation: fadeUp 1s ease-out;
}

.header h1 {
  font-size: 30px;
  font-weight: 700;
  color: #0f172a;
}

.header span {
  color: #2563eb;
}

.header p {
  font-size: 13px;
  color: #475569;
  margin-top: 6px;
}

/* CARD */
.form-container {
  background: rgba(255,255,255,0.75);
  padding: 22px;
  border-radius: 18px;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(59,130,246,0.12);

  /* animasi masuk delay */
  animation: fadeUp 1.2s ease-out;
}

/* INPUT */
.input-group {
  margin-bottom: 14px;
  animation: fadeUp 1.3s ease-out;
}

label {
  font-size: 12px;
  color: #334155;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  margin-top: 6px;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;

  animation: fadeUp 1.4s ease-out;
}

button:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 10px 20px rgba(37,99,235,0.25);
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 12px;
  animation: fadeUp 1.5s ease-out;
}

.footer a {
  color: #2563eb;
  font-size: 13px;
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <h1>Smart <span>Parking</span></h1>
    <p>Login untuk melanjutkan 🚗</p>
  </div>

  <div class="form-container">

    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Masukkan email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Masukkan password">
    </div>

    <button onclick="login()">Masuk</button>

    <div class="footer">
      <a href="daftar.html">Belum punya akun? Daftar</a>
    </div>

  </div>

</div>

<script>
function login() {
  document.querySelector(".wrapper").style.transform = "scale(0.95)";
  document.querySelector(".wrapper").style.opacity = "0.5";

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 300);
}
</script>

</body>
</html>
