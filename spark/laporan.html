<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* glow */
body::before, body::after{
  content:'';
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  filter:blur(120px);
}
body::before{background:#60a5fa;top:-80px;left:-80px;}
body::after{background:#3b82f6;bottom:-80px;right:-80px;}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:400px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(14px);
  padding:22px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(59,130,246,0.15);
  animation:fadeUp 0.6s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

h3{
  text-align:center;
  margin-bottom:4px;
}

.sub{
  text-align:center;
  font-size:12px;
  color:#64748b;
  margin-bottom:16px;
}

/* input group */
.group{
  margin-bottom:14px;
}

label{
  font-size:12px;
  color:#475569;
}

select, textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #e2e8f0;
  outline:none;
}

textarea{
  resize:none;
  height:80px;
}

select:focus, textarea:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.2);
}

/* button */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#3b82f6,#2563eb);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,0.3);
}

/* back */
.back{
  display:block;
  text-align:center;
  margin-top:12px;
  text-decoration:none;
  color:#2563eb;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <h3>Buat Laporan</h3>
  <div class="sub">Laporkan kondisi parkir secara real-time</div>

  <div class="group">
    <label>Area / Slot Parkir</label>
    <select>
      <option>TA</option>
      <option>GU</option>
      <option>Techno</option>
      <option>RTF</option>
    </select>
  </div>

  <div class="group">
    <label>Kondisi Parkir</label>
    <select>
      <option>Kosong</option>
      <option>Terisi</option>
      <option>Rusak</option>
    </select>
  </div>

  <div class="group">
    <label>Deskripsi (Opsional)</label>
    <textarea placeholder="Contoh: Slot rusak, ada motor parkir sembarangan, dll..."></textarea>
  </div>

  <button>Kirim Laporan</button>

  <a href="dashboard.html" class="back">Kembali</a>

</div>

</body>
</html>
